services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens_local
      POSTGRES_DB: claimlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - claimlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      retries: 20
volumes:
  claimlens_pgdata:
